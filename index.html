<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Kartları</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d9e75">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f4f0;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--ok:#1d9e75;--no:#d85a30;--bd:#ddd9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#242422;--tx:#f0efe9;--mut:#9a9a93;--bd:#3a3a36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#242422;--tx:#f0efe9;--mut:#9a9a93;--bd:#3a3a36;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;padding:16px;max-width:480px;width:100%;margin:0 auto;box-sizing:border-box;min-height:0;overflow-y:auto}
h1{font-size:22px;margin:8px 0 4px}
p{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;font-size:20px;cursor:pointer}
button:active{transform:scale(.97)}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:12px}
.track{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px}
.fill{height:100%;background:var(--ok);border-radius:3px;width:0}
#stage{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0 0 60px 0;background:var(--card);border:1px solid var(--bd);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;touch-action:none;user-select:none;text-align:center;padding:12px}
.tag{position:absolute;top:18px;font-size:16px;font-weight:700;border:2px solid;border-radius:8px;padding:2px 10px;opacity:0}
#tk{left:18px;color:var(--ok)}#tu{right:18px;color:var(--no)}
.acts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px}
.acts button{flex:1;padding:12px}
.list{overflow:auto;flex:1;margin-top:8px}
.row{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bd);font-size:17px}
.row span:last-child{color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script>
var UNLOCK=0.8,DAYS=[1,3,7];
var LV=LEVELS.map(function(l){return{id:l.id,words:l.text.split("\n").map(function(s){return s.trim()}).filter(function(s){return s&&s[0]!=="#"&&s.indexOf("|")>0}).map(function(s){var p=s.split("|");return{en:p[0].trim(),tr:p[1].trim(),lv:l.id}})}}).filter(function(l){return l.words.length});
var app=document.getElementById("app"),srs={};
try{srs=JSON.parse(localStorage.getItem("srs")||"{}")}catch(e){}
function save(){try{localStorage.setItem("srs",JSON.stringify(srs))}catch(e){}}
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function learned(w){var r=srs[w.en];return r&&r.s===3}
function cnt(l){return l.words.filter(learned).length}
function due(w){var r=srs[w.en];return r&&r.s<3&&r.t+DAYS[r.s]<=today()}
function key(s){return s.toLocaleLowerCase("tr").replace(/[^\p{L} ]/gu,"").trim().split(" ")[0]}
function ul(){var r=[];for(var i=0;i<LV.length;i++){r.push(i===0||(r[i-1]&&cnt(LV[i-1])/LV[i-1].words.length>=UNLOCK))}return r}
function home(){
  var u=ul(),d=0;
  LV.forEach(function(l,i){if(u[i])l.words.forEach(function(w){if(due(w))d++})});
  var rows=LV.map(function(l,i){return'<div class="row"><span>'+(u[i]?'':'🔒 ')+l.id+'</span><span>'+cnt(l)+' / '+l.words.length+'</span></div>'}).join("");
  app.innerHTML='<h1>Kelime Kartları</h1><p>Bugün tekrarı gelen kelime: '+d+'. Kaç kart çalışacaksın? Bildiklerin sağa, bilmediklerin sola.</p><div class="grid">'+[20,50,100,200].map(function(n){return'<button data-n="'+n+'">'+n+'</button>'}).join("")+'</div><div class="list" style="flex:none;margin-top:16px">'+rows+'</div><p style="margin-top:8px;font-size:13px">Sayılar öğrenilen kelimeleri gösterir (son testi geçenler). Bir seviyedeki kelimelerin %'+UNLOCK*100+' kadarını öğrenince sonraki seviye açılır.</p><button id="rs" style="margin-top:12px;font-size:15px;padding:12px;color:var(--no)">İlerlemeyi sıfırla</button>';
  app.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){start(+b.dataset.n)}});
  document.getElementById("rs").onclick=function(){if(confirm("Tüm ilerlemen silinecek. Emin misin?")&&confirm("Bu işlem geri alınamaz. Gerçekten sıfırlansın mı?")){srs={};save();home()}};
}
var deck,idx,unk,kn,total,before,tp,tt;
function start(n){
  var u=ul(),dv=[],nw=[];
  LV.forEach(function(l,i){if(!u[i])return;shuffle(l.words.slice()).forEach(function(w){if(due(w))dv.push(w);else if(!srs[w.en])nw.push(w)})});
  deck=dv.concat(nw).slice(0,n);
  if(!deck.length){alert("Bugün için kart kalmadı. Yarın tekrar gel ya da words.js dosyasına yeni kelime ekle.");return}
  before=u.filter(Boolean).length;total=deck.length;idx=0;unk=[];kn=0;tp=0;tt=0;show();
}
function show(){
  if(idx>=total)return done();
  var w=deck[idx],r=srs[w.en];
  var bar='<div class="bar"><span>'+(idx+1)+' / '+total+'</span><span>✓ '+kn+' · ✗ '+unk.length+'</span></div><div class="track"><div class="fill" style="width:'+(idx/total*100)+'%"></div></div>';
  if(r&&r.s===2)return test(w,bar);
  app.innerHTML=bar+'<div id="stage"><div class="card" id="c"><span class="tag" id="tk">BİLİYORUM</span><span class="tag" id="tu">BİLMİYORUM</span>'+w.en+'</div><div class="acts"><button id="bu">✗ Bilmiyorum</button><button id="bk">Biliyorum ✓</button></div></div>';
  var c=document.getElementById("c"),x0=null,dx=0;
  c.onpointerdown=function(e){x0=e.clientX;c.setPointerCapture(e.pointerId)};
  c.onpointermove=function(e){if(x0===null)return;dx=e.clientX-x0;c.style.transform="translateX("+dx+"px) rotate("+dx/20+"deg)";document.getElementById("tk").style.opacity=Math.max(0,dx/100);document.getElementById("tu").style.opacity=Math.max(0,-dx/100)};
  c.onpointerup=function(){if(x0===null)return;x0=null;if(dx>90)go(true);else if(dx<-90)go(false);else{c.style.transform="";document.getElementById("tk").style.opacity=0;document.getElementById("tu").style.opacity=0}dx=0};
  document.getElementById("bk").onclick=function(){go(true)};
  document.getElementById("bu").onclick=function(){go(false)};
}
function test(w,bar){
  var lvl=LV.filter(function(l){return l.id===w.lv})[0].words,all=LV.reduce(function(a,l){return a.concat(l.words)},[]),used={},o=[];
  used[key(w.tr)]=1;
  shuffle(lvl.slice()).concat(shuffle(all)).forEach(function(x){var k=key(x.tr);if(o.length<3&&x.en!==w.en&&!used[k]){used[k]=1;o.push(x.tr)}});
  o.push(w.tr);shuffle(o);
  app.innerHTML=bar+'<div id="stage"><div class="card" style="position:static;height:140px;margin-bottom:14px">'+w.en+'</div><p style="text-align:center">Son test: doğru anlamı seç</p>'+o.map(function(t){return'<button class="opt" style="display:block;width:100%;margin-bottom:10px;font-size:18px;padding:14px">'+t+'</button>'}).join("")+'</div>';
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var ok=b.textContent===w.tr;tt++;
    app.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.textContent===w.tr)x.style.borderColor="var(--ok)"});
    if(!ok)b.style.borderColor="var(--no)";
    if(ok){srs[w.en].s=3;tp++}else{srs[w.en]={t:today(),s:0};unk.push(w)}
    save();setTimeout(function(){idx++;show()},ok?600:1400);
  }});
}
function go(ok){
  var w=deck[idx],c=document.getElementById("c"),r=srs[w.en];
  if(ok){kn++;if(!r)srs[w.en]={t:today(),s:0};else r.s++}
  else{unk.push(w);if(r)srs[w.en]={t:today(),s:0}}
  save();c.style.transition="transform .2s,opacity .2s";c.style.transform="translateX("+(ok?500:-500)+"px)";c.style.opacity=0;
  setTimeout(function(){idx++;show()},200);
}
function done(){
  var n=ul().filter(Boolean).length,msg=n>before?'<p style="color:var(--ok)">🎉 Yeni seviye açıldı: '+LV[n-1].id+'</p>':'';
  app.innerHTML='<h1>Bitti 🎉</h1><p>Bildiğin: '+kn+' · Bilmediğin: '+unk.length+(tt?' · Test: '+tp+' / '+tt:'')+'</p>'+msg+'<div class="list">'+(unk.length?unk.map(function(w){return'<div class="row"><span>'+w.en+'</span><span>'+w.tr+'</span></div>'}).join(""):'<p>Hepsini biliyorsun!</p>')+'</div><button id="h" style="margin-top:12px">Başa dön</button>';
  document.getElementById("h").onclick=home;
}
home();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
